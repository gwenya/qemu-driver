version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    # dependabot's own commit messages have to match the repo's convention
    commit-message:
      prefix: "chore"

  - package-ecosystem: gomod
    directory: "/hack/tools"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
